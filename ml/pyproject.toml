[project]
name = "modelops-ml"
version = "0.1.0"
description = "Trusted training code for ModelOps Cloud demo models (synthetic churn -> ONNX -> MLflow)"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "numpy==2.5.4",
  "pandas==3.1.0",
  "scikit-learn==1.9.1",
  "skl2onnx==1.20.0",
  "onnx==1.23.2",
  "onnxruntime==1.31.1",
  "onnxscript==0.7.2",
  "torch==2.14.1",
  "mlflow-skinny==3.17.2",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modelops_ml"]

[tool.uv]
# Supply-chain policy (ADR-0007): resolve only releases published at least 7 days before this date,
# including transitive dependencies. Bump deliberately between milestones.
exclude-newer = "2026-10-28T00:00:00Z"

# CPU-only PyTorch: no CUDA download (~200 MB instead of ~2.5 GB). Free, runs on any laptop.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
