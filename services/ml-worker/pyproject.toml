[project]
name = "modelops-ml-worker"
version = "0.1.0"
description = "Internal ML worker: validates ONNX model bundles (M4); evaluation and drift come in M7"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "boto3==1.43.120",
  "numpy==2.5.4",
  "onnx==1.23.2",
  "onnxruntime==1.31.1",
  "evidently==0.7.23",
  "pandas>=2.2,<3",
  "scikit-learn==1.9.1",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3", "httpx==0.28.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml_worker"]

[tool.uv]
# Same supply-chain rule as ml/ (ADR-0007): only releases at least 7 days old at lock time.
exclude-newer = "2026-11-06T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
