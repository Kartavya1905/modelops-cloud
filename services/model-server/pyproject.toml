[project]
name = "modelops-model-server"
version = "0.1.0"
description = "Serves exactly one validated ONNX model revision (one container per revision, M5)"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "numpy==2.5.4",
  "onnxruntime==1.31.1",
  "opentelemetry-sdk==1.45.2",
  "opentelemetry-exporter-otlp-proto-http==1.45.2",
  "opentelemetry-instrumentation-fastapi==0.66b2",
]

[dependency-groups]
# onnx only builds small test models; the server itself never parses protobuf outside ORT.
dev = ["pytest==9.2.0", "ruff==0.17.3", "httpx==0.28.1", "onnx==1.23.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model_server"]

[tool.uv]
# Same supply-chain rule as ml/ and ml-worker (ADR-0007): releases at least 7 days old at lock time.
exclude-newer = "2026-11-03T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
