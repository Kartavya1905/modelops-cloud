# ModelOps Cloud on kind (M10). One node: this is a laptop.
# Host ports (127.0.0.1 only) map to NodePorts of the platform's Services (infra/k8s).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: modelops
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      - { containerPort: 30088, hostPort: 18188, listenAddress: '127.0.0.1' } # gateway (public)
      - { containerPort: 30089, hostPort: 18189, listenAddress: '127.0.0.1' } # gateway (admin)
      - { containerPort: 30098, hostPort: 18198, listenAddress: '127.0.0.1' } # test gateway (public)
      - { containerPort: 30099, hostPort: 18199, listenAddress: '127.0.0.1' } # test gateway (admin)
      - { containerPort: 30400, hostPort: 14400, listenAddress: '127.0.0.1' } # API
      - { containerPort: 30300, hostPort: 13400, listenAddress: '127.0.0.1' } # web
    # Kubelet settings:
    # - podPidsLimit: per-pod process limit (Docker runs model servers with --pids-limit 128): a
    #   fork bomb in a model stays inside its pod. Applies to every pod; 256 leaves room for Node.
    # - readOnlyPort: the kubelet's unauthenticated read-only HTTP port, so the compose Prometheus
    #   can scrape container CPU/memory (/metrics/cadvisor) without cluster credentials. LOCAL
    #   ONLY: the node is reachable from the compose networks on this machine and nothing else
    #   (no host port mapping). Never enable it on a shared cluster (docs/06, M10 doc).
    kubeadmConfigPatches:
      - |
        kind: KubeletConfiguration
        podPidsLimit: 256
        readOnlyPort: 10255
