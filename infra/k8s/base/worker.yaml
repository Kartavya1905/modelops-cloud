# Worker: validation, deploy orchestration, reconciler, canary analysis, drift. The only
# component with Kubernetes credentials, limited to the model-server namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: modelops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: model-server-manager
  namespace: modelops-models
rules:
  # Exactly what the KubernetesDriver calls: no exec, no secrets, no other namespaces.
  - apiGroups: ['']
    resources: [pods, services]
    verbs: [get, list, create, delete]
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: worker-manages-model-servers
  namespace: modelops-models
subjects:
  - { kind: ServiceAccount, name: worker, namespace: modelops }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: model-server-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: modelops
  labels: { app.kubernetes.io/name: worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: worker }
    spec:
      serviceAccountName: worker
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: modelops/api:dev
          imagePullPolicy: IfNotPresent
          command: [node, --enable-source-maps, dist/worker.js]
          envFrom:
            - configMapRef: { name: modelops-config }
            - secretRef: { name: modelops-secrets }
          env:
            - { name: OTEL_SERVICE_NAME, value: modelops-worker }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: '1', memory: 768Mi }
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
