# Web console (Next.js). The browser calls /api/* here; Next forwards it to the `api` Service
# (fixed at image build time: apps/web/Dockerfile).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: modelops
  labels: { app.kubernetes.io/name: web }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: web }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: modelops/web:dev
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 3300 }]
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: '1', memory: 512Mi }
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: next-cache, mountPath: /app/apps/web/.next/cache }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: next-cache
          emptyDir: { sizeLimit: 128Mi }
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: modelops
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: web }
  ports:
    - { name: http, port: 3300, targetPort: http, nodePort: 30300 } # -> 127.0.0.1:13400
